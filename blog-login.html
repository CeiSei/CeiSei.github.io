<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>로그인 인증 중계</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .box { background: #f4f4f4; padding: 20px; display: inline-block; border-radius: 8px; }
        input { width: 300px; padding: 10px; font-size: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h3>로그인 처리 중...</h3>
        <p id="status">잠시만 기다려주세요.</p>
        <div id="pc-fallback" style="display:none;">
            <p>PC 환경이신가요? 아래 인증 코드를 복사하여 게임에 입력해주세요.</p>
            <input type="text" id="authCodeInput" readonly onclick="this.select();">
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 1. 모바일 시도: 커스텀 스킴 호출
            const deepLinkUrl = `mygame://callback?code=${code}`;
            window.location.href = deepLinkUrl;

            // 2. PC 환경을 위한 Fallback (모바일이 아니라면 코드를 화면에 노출)
            setTimeout(() => {
                document.getElementById('status').innerText = "로그인 인증 코드가 발급되었습니다.";
                document.getElementById('pc-fallback').style.display = "block";
                document.getElementById('authCodeInput').value = code;
            }, 500);
        } else {
            document.getElementById('status').innerText = "로그인 실패: 인증 코드가 없습니다.";
        }
    </script>
</body>
</html>
