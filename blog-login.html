<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>로그인 자동 연동 중...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #222; color: #fff; }
        .box { background: #333; padding: 30px; display: inline-block; border-radius: 8px; }
        h3 { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="box">
        <h3>로그인 처리 중...</h3>
        <p id="status">게임으로 인증 정보를 전달하고 있습니다.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 1. 모바일 환경: 커스텀 스킴 호출
            const deepLinkUrl = `mygame://callback?code=${code}`;
            
            // 2. PC 환경: Unity 로컬 서버로 code 전송 시도
            const localUnityUrl = `http://localhost:8080/?code=${code}`;

            // 로컬 서버로 fetch 요청 전송 (CORS 우회를 위해 no-cors 모드 활용 또는 리다이렉트)
            fetch(localUnityUrl, { mode: 'no-cors' }).then(() => {
                document.getElementById('status').innerText = "연동 완료! 게임 창으로 돌아가세요.";
            }).catch(err => {
                // 로컬 서버가 안 켜져있거나 모바일인 경우 수동 복사 폴백 노출 가능
                document.getElementById('status').innerText = "자동 전달 실패. 수동으로 코드를 복사해주세요: " + code;
            });

            // 모바일 스킴 호출 시도
            window.location.href = deepLinkUrl;
        } else {
            document.getElementById('status').innerText = "로그인 실패: 코드가 없습니다.";
        }
    </script>
</body>
</html>
