<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>로그인 인증 중계</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #222; color: #fff; }
        .box { background: #333; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input { width: 350px; padding: 12px; font-size: 16px; text-align: center; margin-top: 10px; background: #222; color: #0ff; border: 1px solid #555; border-radius: 4px; }
        h3 { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="box">
        <h3>로그인 성공!</h3>
        <p id="status">인증 코드를 확인하는 중입니다...</p>
        
        <div id="pc-fallback" style="display:none;">
            <p>아래 인증 코드를 복사하여 <b>Unity 게임 내 입력창</b>에 붙여넣어 주세요.</p>
            <input type="text" id="authCodeInput" readonly onclick="this.select();">
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 1. 모바일 환경 시도: 커스텀 스킴 호출하여 앱 복귀
            const deepLinkUrl = `mygame://callback?code=${code}`;
            window.location.href = deepLinkUrl;

            // 2. PC 환경 대응: 모바일이 아니거나 스킴 처리가 안 될 경우를 대비해 화면에 코드 노출
            setTimeout(() => {
                document.getElementById('status').innerText = "인증 코드가 발급되었습니다.";
                document.getElementById('pc-fallback').style.display = "block";
                document.getElementById('authCodeInput').value = code;
                // 클립보드에 자동 복사 시도
                navigator.clipboard.writeText(code).then(() => {
                    console.log("클립보드에 코드가 복사되었습니다.");
                }).catch(err => {
                    console.log("클립보드 복사 실패 (수동 복사 필요)");
                });
            }, 500);
        } else {
            document.getElementById('status').style.color = "#ff5252";
            document.getElementById('status').innerText = "로그인 실패: 인증 코드를 찾을 수 없습니다.";
        }
    </script>
</body>
</html>
